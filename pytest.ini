[pytest]
# Test discovery
testpaths = test-cases/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Plugins
# pytest-html should auto-register, but explicitly ensure it's available

# Test execution options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=5
    --durations=10
    --cache-disable
    --cache-clear
    --disable-warnings

# Markers for test categorization
markers =
    tcs: marks tests with TCS (Test Case Structure) format
    smoke: marks tests as smoke tests (quick validation)
    regression: marks tests as regression tests (comprehensive)
    slow: marks tests as slow running (may take > 30 seconds)
    browser_chrome: marks tests to run on Chrome browser
    browser_firefox: marks tests to run on Firefox browser
    browser_safari: marks tests to run on Safari/WebKit browser
    headless: marks tests to run in headless mode
    video: marks tests to record video
    screenshot: marks tests to take screenshots
    login: marks tests related to login functionality
    ui: marks tests related to UI elements
    api: marks tests related to API functionality
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Test collection options
# Note: collect_ignore is deprecated in pytest 8+, use pytest_collection_modifyitems hook instead
# collect_ignore = setup.py conftest.py

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds) - requires pytest-timeout plugin
# timeout = 300  # Commented out - requires pytest-timeout plugin to be installed

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:playwright.*

# Playwright configuration
[tool:pytest-playwright]
browser = chromium
headless = false
slow_mo = 1000
# Capture screenshots on failure
screenshot = on-failure
# Capture videos on failure
video = on-failure
